name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: qualaboa
          POSTGRES_USER: qualaboa
          POSTGRES_PASSWORD: qualaboa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qualaboa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build e testes
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/qualaboa
          DB_USER: qualaboa
          DB_PASSWORD: qualaboa
          JWT_SECRET: segredo-de-teste-para-ci-com-mais-de-32-bytes
          CORS_ORIGENS: http://localhost:5173
        run: ./mvnw -B --no-transfer-progress verify
      - name: Relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm test -- --run
      - working-directory: frontend
        run: npm run build

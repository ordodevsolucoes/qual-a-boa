spring.application.name=qual-a-boa-api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# validate: o esquema so pode mudar por migracao Flyway, nunca por auto ddl do Hibernate
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info

# nao expor stacktrace em resposta de erro, mesmo em ambiente sem profile de producao definido
server.error.include-stacktrace=never

# Cloud Run injeta a porta em tempo de execucao via variavel PORT
server.port=${PORT:8080}

seguranca.jwt.secret=${JWT_SECRET}

app.cors.allowed-origins=${CORS_ORIGENS}
